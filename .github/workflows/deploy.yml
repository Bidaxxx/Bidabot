name: 🚀 Auto-Deploy to Oracle Cloud

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    name: Deploy Sentinel Bot & Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Déclenchement de la mise à jour sur Oracle VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            echo "⚡ Nouvelle mise à jour détectée depuis GitHub..."
            cd ~/sentinel/sentinel
            git pull origin main || git pull origin master
            echo "🔄 Redémarrage à chaud des conteneurs Bot et Dashboard..."
            docker compose restart bot dashboard
            echo "✅ Déploiement Sentinel terminé avec succès !"
