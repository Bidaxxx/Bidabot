<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — BIDABOT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=20261001_mono_v4">
  <style>
    /* Monochrome Sombre Absolu — Annulation stricte de tout cache */
    html, body {
      background-color: #000000 !important;
      background-image: none !important;
      color: #ffffff !important;
    }
    * {
      box-shadow: none !important;
      text-shadow: none !important;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      background-color: var(--bg);
    }
    .auth-card {
      width: 100%;
      max-width: 360px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
    }
    .auth-header {
      margin-bottom: 24px;
    }
    .auth-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .auth-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
      letter-spacing: -0.02em;
    }
    .auth-sub {
      font-size: 12.5px;
      color: var(--text-muted);
    }
    .btn-oauth {
      width: 100%;
      padding: 9px 14px;
      background-color: #ffffff;
      color: #000000;
      border: 1px solid #ffffff;
      border-radius: var(--radius);
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 100ms ease;
    }
    .btn-oauth:hover {
      background-color: #e4e4e7;
    }
    .btn-oauth svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
    .auth-divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 20px 0;
    }
    .auth-divider::before, .auth-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border);
    }
    .auth-divider::before { margin-right: 10px; }
    .auth-divider::after { margin-left: 10px; }
    .auth-alert {
      padding: 8px 12px;
      margin-bottom: 16px;
      border: 1px solid var(--danger-border);
      background-color: var(--danger-bg);
      color: var(--danger);
      font-size: 12px;
      border-radius: var(--radius);
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-tag">BIDABOT / CONSOLE</div>
      <h1 class="auth-title">Connexion</h1>
      <p class="auth-sub">Accédez à la console de gestion et aux modules de crise.</p>
    </div>

    {% if error %}
      <div class="auth-alert">
        Session expirée ou accès non autorisé.
      </div>
    {% endif %}

    <!-- Connexion Discord OAuth2 -->
    <a href="{{ oauth_url }}" class="btn-oauth">
      <svg viewBox="0 0 127.14 96.36">
        <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,0,105.15,105.15,0,0,0,22.77,8.07C2.79,37.8-.31,66.82.08,95.5a105.73,105.73,0,0,0,32.22,16.29,76.5,76.5,0,0,0,6.89-11.18,67.57,67.57,0,0,1-10.87-5.26c.92-.67,1.81-1.37,2.67-2.09a74.37,74.37,0,0,0,64.26,0c.86.72,1.75,1.42,2.67,2.09a67.57,67.57,0,0,1-10.87,5.26,76.5,76.5,0,0,0,6.89,11.18,105.73,105.73,0,0,0,32.22-16.29C128.52,62.8,124.78,34.07,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53.07s5-12.62,11.45-12.62,11.55,5.71,11.45,12.62C53.9,60,48.82,65.69,42.45,65.69Zm42.24,0C78.42,65.69,73.25,60,73.25,53.07s5.07-12.62,11.44-12.62,11.55,5.71,11.44,12.62C96.13,60,91.06,65.69,84.69,65.69Z"/>
      </svg>
      <span>Se connecter avec Discord</span>
    </a>

    <div class="auth-divider">ou mot de passe staff</div>

    <!-- Authentification Mot de Passe Direct -->
    <form action="/login" method="post">
      <div class="form-group">
        <label for="password" class="form-label">Mot de passe</label>
        <input type="password" id="password" name="password" required class="form-input" placeholder="••••••••••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-secondary" style="width: 100%; padding: 8px;">
        Valider l'accès
      </button>
    </form>

    <div style="margin-top: 20px; text-align: center;">
      <a href="/" style="font-size: 11.5px; color: var(--text-dim);">← Retour au site public</a>
    </div>
  </div>

</body>
</html>
