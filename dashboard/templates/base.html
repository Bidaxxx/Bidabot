<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIDABOT — Cyber SOC & Forensique Discord</title>
  <meta name="description" content="Plateforme de cyber-défense et forensique Ed25519 pour serveurs Discord.">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#07090e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=20261002_keeper_clean_v10">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

  <!-- Navigation Cyber SOC -->
  <nav class="navbar">
    <div style="display: flex; align-items: center; gap: 24px;">
      <a href="/" class="nav-brand">
        <span class="brand-badge-dot"></span>
        <span class="brand-name">BIDABOT</span>
        <span class="brand-tag">SOC CORE &bull; ED25519</span>
      </a>
      <div class="nav-links">
        <a href="/#features" class="nav-link">Fonctionnalités</a>
        <a href="/#commands" class="nav-link">Commandes</a>
        <a href="/#scanner" class="nav-link">Scanner ML</a>
        <a href="/dashboard" class="nav-link">Serveurs</a>
      </div>
    </div>

    <div class="nav-actions">
      <!-- Bouton Son Cyber Alert (Sans emoji) -->
      <button id="audio-toggle-btn" class="btn btn-secondary btn-sm" onclick="toggleAudioAlerts()" title="Activer / Couper les alertes sonores de détection" style="display: inline-flex; align-items: center; gap: 6px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        <span>Son : ON</span>
      </button>

      {% if user %}
        <div style="display: flex; align-items: center; gap: 8px; padding: 4px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);">
          <img src="{{ user.avatar }}" alt="{{ user.username }}" style="width: 20px; height: 20px; border-radius: 4px; object-fit: cover;">
          <span style="font-size: 12px; font-weight: 600; color: var(--text-main);">{{ user.username }}</span>
        </div>
        <a href="/logout" class="btn btn-secondary btn-sm">Déconnexion</a>
      {% else %}
        <a href="/login" class="btn btn-primary btn-sm">Console Staff</a>
      {% endif %}
    </div>
  </nav>

  <!-- Contenu Principal -->
  <main class="dash-main">
    {% block content %}{% endblock %}
  </main>

  <!-- Conteneur Flottant de Notifications Toast SOC -->
  <div id="soc-toast-container" class="soc-toast-container"></div>

  <!-- Footer Discret -->
  <footer class="footer">
    <div class="footer-inner">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-weight: 700; letter-spacing: -0.01em; color: var(--text-main);">BIDABOT</span>
        <span style="color: var(--border);">&bull;</span>
        <span style="color: var(--text-muted);">Architecture Zero-Trust & Forensique Immuable pour Discord</span>
      </div>
      <div class="footer-links">
        <a href="/#commands">Commandes</a>
        <a href="/dashboard">Console SOC</a>
        <a href="/login">Accès Staff</a>
        <a href="https://github.com/Bidaxxx/Bidabot" target="_blank" style="color: var(--cyber-cyan);">GitHub</a>
      </div>
    </div>
  </footer>

  <script src="/static/app.js?v=20261002_soc_v2"></script>
</body>
</html>
