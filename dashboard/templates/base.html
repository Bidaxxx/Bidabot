<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIDABOT — Sécurité Discord & Forensique</title>
  <meta name="description" content="Plateforme SaaS de sécurité pour infrastructures Discord. Anti-nuke, war rooms, analyse vectorielle et chaîne forensique signée Ed25519.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=20261001_mono_v4">
  <style>
    /* Monochrome Sombre Absolu — Annulation stricte de tout cache */
    html, body {
      background-color: #000000 !important;
      background-image: none !important;
      color: #ffffff !important;
    }
    .brand-name {
      background: none !important;
      -webkit-text-fill-color: #ffffff !important;
      color: #ffffff !important;
    }
    .btn-primary {
      background: #ffffff !important;
      color: #000000 !important;
      box-shadow: none !important;
      border: 1px solid #ffffff !important;
      border-radius: 4px !important;
    }
    .btn-primary:hover {
      background: #d4d4d8 !important;
      color: #000000 !important;
    }
    .btn-secondary {
      background: #000000 !important;
      color: #ffffff !important;
      box-shadow: none !important;
      border: 1px solid #222225 !important;
      border-radius: 4px !important;
    }
    .btn-secondary:hover {
      background: #141414 !important;
      border-color: #333333 !important;
    }
    * {
      box-shadow: none !important;
      text-shadow: none !important;
    }
  </style>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>

  <!-- Navigation Minimaliste -->
  <nav class="navbar">
    <div style="display: flex; align-items: center; gap: 24px;">
      <a href="/" class="nav-brand">
        <span class="brand-name">BIDABOT</span>
        <span class="brand-tag">v2.4 / ED25519</span>
      </a>
      <div class="nav-links">
        <a href="/#features" class="nav-link">Fonctionnalités</a>
        <a href="/#commands" class="nav-link">Commandes</a>
        <a href="/#scanner" class="nav-link">Simulateur</a>
        <a href="/dashboard" class="nav-link">Serveurs</a>
      </div>
    </div>

    <div class="nav-actions">
      {% if user %}
        <div style="display: flex; align-items: center; gap: 8px; padding: 3px 8px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);">
          <img src="{{ user.avatar }}" alt="{{ user.username }}" style="width: 18px; height: 18px; border-radius: 2px; object-fit: cover;">
          <span style="font-size: 12px; font-weight: 500;">{{ user.username }}</span>
        </div>
        <a href="/logout" class="btn btn-secondary btn-sm">Déconnexion</a>
      {% else %}
        <a href="/login" class="btn btn-primary btn-sm">Console Staff</a>
      {% endif %}
    </div>
  </nav>

  <!-- Contenu Principal -->
  <main class="dash-main">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer Discret -->
  <footer class="footer">
    <div class="footer-inner">
      <div>
        <span style="font-weight: 600; color: var(--text-main);">BIDABOT</span>
        <span style="margin: 0 8px; color: var(--border);">&bull;</span>
        <span>Système de défense et chaîne forensique immuable pour Discord</span>
      </div>
      <div class="footer-links">
        <a href="/#commands">Commandes</a>
        <a href="/dashboard">Console</a>
        <a href="/login">Accès Staff</a>
      </div>
    </div>
  </footer>

  <script>
    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = 'toast-alert';
      toast.innerText = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.classList.add('visible'), 20);
      setTimeout(() => {
        toast.classList.remove('visible');
        setTimeout(() => toast.remove(), 120);
      }, 3000);
    }
  </script>

</body>
</html>
